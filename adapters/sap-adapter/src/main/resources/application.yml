server:
  port: ${PORT:8090}

spring:
  application:
    name: sap-adapter
  datasource:
    # Runtime role: non-owner, subject to row-level security.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sapadapter}
    username: ${DB_APP_USER:astra_app}
    password: ${DB_APP_PASSWORD:astra_app_dev}
  flyway:
    # Migrations run as the schema owner.
    user: ${DB_OWNER_USER:astra_owner}
    password: ${DB_OWNER_PASSWORD:astra_owner_dev}
    locations: classpath:db/migration/common,classpath:db/migration
    placeholders:
      appRole: ${DB_APP_USER:astra_app}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

astra:
  security:
    # Tokens are accepted only from this identity provider (ADR-0010). Defaults: the local Keycloak.
    jwt:
      issuer: ${OIDC_ISSUER:http://localhost:8180/realms/astrawms}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/astrawms/protocol/openid-connect/certs}
      audience: astrawms-api
  outbox:
    relay-interval-ms: 500
  sap:
    # SAP logical system (<SID>_<client>) used as sourceSystem on messages the adapter translates (ISD-00 §2)
    logical-system: ${SAP_LOGICAL_SYSTEM:SAP_S4_DEV_100}
    gateway: ${SAP_GATEWAY:mock}
