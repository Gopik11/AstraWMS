name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests (Testcontainers: Postgres 16, Kafka)
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test and build the web UI
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The platform-independent core (EPC/GS1 codecs, tag buffer, API client, offline queue) on the JVM,
      # then the Android app (the runner image has the Android SDK).
      - name: Test the core and build the Android app
        run: |
          ./gradlew --no-daemon -p core test
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astrawms-rf-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
