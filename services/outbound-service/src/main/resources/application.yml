server:
  port: ${PORT:8085}

spring:
  application:
    name: outbound-service
  datasource:
    # Runtime role: non-owner, subject to row-level security.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:outbound}
    username: ${DB_APP_USER:astra_app}
    password: ${DB_APP_PASSWORD:astra_app_dev}
  flyway:
    # Migrations run as the schema owner.
    user: ${DB_OWNER_USER:astra_owner}
    password: ${DB_OWNER_PASSWORD:astra_owner_dev}
    locations: classpath:db/migration/common,classpath:db/migration
    placeholders:
      appRole: ${DB_APP_USER:astra_app}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

astra:
  outbox:
    relay-interval-ms: 500
  inventory:
    base-url: ${INVENTORY_URL:http://localhost:8082}
    timeout-ms: 3000
  outbound:
    # Outbound staging lane that picks are dropped at (location type STAGING_OUT); per-site lanes come with dock planning.
    staging-location: ${OUTBOUND_STAGING_LOCATION:STAGE-OUT}
    pick-priority: 60
