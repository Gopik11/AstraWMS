// Kafka broker accounts for the LOCAL stack only (dev passwords). Every service has its own account (ADR-0018);
// the VPS renders this file from generated secrets (deploy/vps/remote-deploy.sh).
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="broker" password="broker-dev"
  user_broker="broker-dev"
  user_master-data-service="kafka-dev"
  user_inventory-service="kafka-dev"
  user_inbound-service="kafka-dev"
  user_task-service="kafka-dev"
  user_outbound-service="kafka-dev"
  user_sap-adapter="kafka-dev";
};
