# Local AstraWMS stack: Postgres 16, single-node Kafka (KRaft), Keycloak (identity provider), the API gateway,
# master-data, inventory, inbound, task and outbound services, and the SAP adapter with its simulated SAP backend.
#   docker compose -f deploy/docker-compose.yml up -d --build
#   scripts/smoke-test.sh && scripts/smoke-inbound.sh && scripts/smoke-outbound.sh
#
# Entry points: web UI and API gateway http://localhost:8080, Keycloak http://localhost:8180 (admin console: admin / admin).
# Services are reachable only through the gateway. All passwords and client secrets here are for local use only.
name: astrawms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  # Creates missing service databases on every start: initdb scripts only run on an empty volume.
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        for db in masterdata inventory inbound sapadapter tasks outbound; do
          psql -h postgres -U postgres -tAc "select 1 from pg_database where datname = '$$db'" | grep -q 1             || psql -h postgres -U postgres -c "create database $$db owner astra_owner"
        done
    restart: "no"

  kafka:
    image: apache/kafka-native:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Clients authenticate with SASL/PLAIN, one account per service (kafka/jaas.local.conf, ADR-0018).
      # EXTERNAL (localhost:29092) stays unauthenticated for local debugging tools only.
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./kafka/jaas.local.conf:/etc/kafka/secrets/jaas.conf:ro
    ports:
      - "29092:29092"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry this issuer, whichever address they were requested on; services fetch keys over the
      # internal network (keycloak:8080).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    volumes:
      - ./gateway/ui-config.local.json:/etc/astrawms/ui-config.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - master-data-service
      - inventory-service
      - inbound-service
      - task-service
      - outbound-service
      - sap-adapter

  master-data-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: master-data-service
    environment: &service-env
      PORT: "8080"
      DB_HOST: postgres
      DB_NAME: masterdata
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: PLAIN
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="master-data-service" password="kafka-dev";
      OIDC_ISSUER: http://localhost:8180/realms/astrawms
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/astrawms/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8080/realms/astrawms/protocol/openid-connect/token
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  inventory-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: inventory-service
    environment:
      <<: *service-env
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="inventory-service" password="kafka-dev";
      DB_NAME: inventory
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  inbound-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: inbound-service
    environment:
      <<: *service-env
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="inbound-service" password="kafka-dev";
      DB_NAME: inbound
      INVENTORY_URL: http://inventory-service:8080
      OIDC_CLIENT_ID: astra-inbound
      OIDC_CLIENT_SECRET: inbound-dev-secret
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  task-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: task-service
    environment:
      <<: *service-env
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="task-service" password="kafka-dev";
      DB_NAME: tasks
      INVENTORY_URL: http://inventory-service:8080
      INBOUND_URL: http://inbound-service:8080
      OIDC_CLIENT_ID: astra-task
      OIDC_CLIENT_SECRET: task-dev-secret
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  outbound-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: outbound-service
    environment:
      <<: *service-env
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="outbound-service" password="kafka-dev";
      DB_NAME: outbound
      INVENTORY_URL: http://inventory-service:8080
      OIDC_CLIENT_ID: astra-outbound
      OIDC_CLIENT_SECRET: outbound-dev-secret
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  sap-adapter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: sap-adapter
        MODULE_DIR: adapters
    environment:
      <<: *service-env
      SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="sap-adapter" password="kafka-dev";
      DB_NAME: sapadapter
      SAP_LOGICAL_SYSTEM: SAP_S4_DEV_100
      SAP_GATEWAY: mock
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  # Optional: docker compose --profile monitoring up -d   ->  http://localhost:9090 (alerts under /alerts)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pgdata:
