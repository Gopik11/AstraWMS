# Local AstraWMS stack: Postgres 16, single-node Kafka (KRaft), master-data, inventory, inbound and task services,
# and the SAP adapter with its simulated SAP backend.
#   docker compose -f deploy/docker-compose.yml up -d --build
#   scripts/smoke-test.sh && scripts/smoke-inbound.sh
name: astrawms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  # Creates missing service databases on every start: initdb scripts only run on an empty volume.
  db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        for db in masterdata inventory inbound sapadapter tasks; do
          psql -h postgres -U postgres -tAc "select 1 from pg_database where datname = '$$db'" | grep -q 1             || psql -h postgres -U postgres -c "create database $$db owner astra_owner"
        done
    restart: "no"

  kafka:
    image: apache/kafka-native:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"

  master-data-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: master-data-service
    environment: &service-env
      PORT: "8080"
      DB_HOST: postgres
      DB_NAME: masterdata
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  inventory-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: inventory-service
    environment:
      <<: *service-env
      DB_NAME: inventory
    ports:
      - "8082:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  inbound-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: inbound-service
    environment:
      <<: *service-env
      DB_NAME: inbound
      INVENTORY_URL: http://inventory-service:8080
    ports:
      - "8083:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  task-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: task-service
    environment:
      <<: *service-env
      DB_NAME: tasks
      INVENTORY_URL: http://inventory-service:8080
    ports:
      - "8084:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  sap-adapter:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: sap-adapter
        MODULE_DIR: adapters
    environment:
      <<: *service-env
      DB_NAME: sapadapter
      SAP_LOGICAL_SYSTEM: SAP_S4_DEV_100
      SAP_GATEWAY: mock
    ports:
      - "8090:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started

volumes:
  pgdata:
