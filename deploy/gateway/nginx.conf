# AstraWMS API gateway (local stack). The single entry point: services are not published on the host.
# Routing, request limits and rate limiting (NFR-125) here; every service still validates the bearer token itself
# (ADR-0010). TLS terminates at the ingress / load balancer in real environments (NFR-102).
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker DNS; variables in proxy_pass make nginx resolve upstreams per request, so it starts before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting per client address: 50 requests/s sustained, bursts of 100. Per-tenant quotas belong to the
    # managed API gateway, which can read the validated token.
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=50r/s;
    limit_req_status 429;

    client_max_body_size 2m;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    map $request_uri $retry_after { default 1; }

    server {
        listen 8080;

        limit_req zone=per_client burst=100 nodelay;

        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Only AstraWMS service accounts may name an acting user, and they call services directly, never through here.
        proxy_set_header X-User-Id "";
        # The RF channel is set only by the task service on its calls to other services (ADR-0021: RF-only floor work).
        proxy_set_header X-Channel "";

        error_page 429 = @too_many;
        location @too_many {
            add_header Retry-After $retry_after always;
            default_type application/problem+json;
            return 429 '{"type":"https://astrawms.com/problems/rate-limited","title":"Too Many Requests","status":429,"code":"RATE_LIMITED"}';
        }

        # First match wins: site sub-resources before master data's /sites.
        location ~ ^/api/v1/sites/[^/]+/inventory(/|$) { set $up http://inventory-service:8080; proxy_pass $up; }
        location ~ ^/api/v1/sites/[^/]+/(receipts|returns|yard)(/|$) { set $up http://inbound-service:8080; proxy_pass $up; }
        location ~ ^/api/v1/sites/[^/]+/tasks(/|$)     { set $up http://task-service:8080;      proxy_pass $up; }
        location ~ ^/api/v1/sites/[^/]+/outbound(/|$)  { set $up http://outbound-service:8080;  proxy_pass $up; }
        location ~ ^/api/v1/(items|sites)(/|$)         { set $up http://master-data-service:8080; proxy_pass $up; }
        # Site network view (ADR-0024): each service reports its half across the user's sites.
        location = /api/v1/network/inventory           { set $up http://inventory-service:8080; proxy_pass $up; }
        location = /api/v1/network/inbound             { set $up http://inbound-service:8080;   proxy_pass $up; }
        location = /api/v1/network/outbound            { set $up http://outbound-service:8080;  proxy_pass $up; }
        location = /api/v1/network/tasks               { set $up http://task-service:8080;      proxy_pass $up; }
        # Operations API of one service (dead letters, outbox): /api/v1/ops/<service>/x -> <service>/api/v1/ops/x (ADR-0018).
        location ~ ^/api/v1/ops/(master-data-service|inventory-service|inbound-service|task-service|outbound-service|sap-adapter)/(.*)$ {
            set $up http://$1:8080/api/v1/ops/$2$is_args$args;
            proxy_pass $up;
        }
        location ~ ^/api/v1/sap/                       { set $up http://sap-adapter:8080;       proxy_pass $up; }
        # Simulated SAP backend (local stack only; admin role required by the adapter).
        location ~ ^/mock-sap/                         { set $up http://sap-adapter:8080;       proxy_pass $up; }

        # Identity provider: discovery, token and login endpoints of the astrawms realm only. The master realm and
        # the admin console are not routed (deployed environments reach them through an SSH tunnel).
        location ^~ /realms/astrawms/ { set $up http://keycloak:8080; proxy_pass $up; }
        location ^~ /resources/       { set $up http://keycloak:8080; proxy_pass $up; }

        # Readiness of each service, without exposing the rest of /actuator.
        location ~ ^/health/(master-data-service|inventory-service|inbound-service|task-service|outbound-service|sap-adapter)$ {
            set $up http://$1:8080/actuator/health;
            proxy_pass $up;
        }

        # Unknown API paths answer as the API does, not with the web app.
        location /api/ {
            default_type application/problem+json;
            return 404 '{"type":"https://astrawms.com/problems/not-found","title":"Not Found","status":404,"code":"ROUTE_UNKNOWN"}';
        }

        # Web UI: environment settings (OIDC authority, client) mounted per deployment.
        location = /config.json {
            alias /etc/astrawms/ui-config.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
        # Hashed build assets can be cached for good; everything else falls back to the single-page app.
        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
