# Host nginx vhosts for AstraWMS on the shared VPS. Only these files are added; the other applications' vhosts are
# untouched. Always run `nginx -t` before `systemctl reload nginx`.
#
# 1. /etc/nginx/sites-available/astrawms-cloud (linked into sites-enabled): the block below. Install it, then:
#      certbot --nginx -d astrawms.cloud -d www.astrawms.cloud --cert-name astrawms-cloud --redirect --non-interactive
#    certbot adds the listen 443 and certificate lines and the HTTP -> HTTPS redirect; the host's certbot timer renews.
#    DNS: A records for astrawms.cloud and www.astrawms.cloud -> 145.223.90.247.
# 2. /etc/nginx/sites-available/astrawms: the earlier address https://145-223-90-247.sslip.io (certificate
#    "astrawms"), kept only to redirect to https://astrawms.cloud.
server {
    listen 80;
    listen [::]:80;
    server_name astrawms.cloud www.astrawms.cloud;

    # One canonical address: the identity provider and the web client are configured for https://astrawms.cloud.
    if ($host = www.astrawms.cloud) {
        return 301 https://astrawms.cloud$request_uri;
    }

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
