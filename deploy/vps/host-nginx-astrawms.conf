# Host nginx vhost for AstraWMS on the shared VPS: /etc/nginx/sites-available/astrawms, linked into sites-enabled.
# Only this file is added; the other applications' vhosts are untouched. Install it, then let certbot add TLS:
#
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d 145-223-90-247.sslip.io --cert-name astrawms --redirect --non-interactive
#
# certbot adds the listen 443 and certificate lines and the HTTP -> HTTPS redirect; the host's certbot timer renews it.
# sslip.io resolves 145-223-90-247.sslip.io to 145.223.90.247, which gives Let's Encrypt a name to certify.
server {
    listen 80;
    listen [::]:80;
    server_name 145-223-90-247.sslip.io;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
