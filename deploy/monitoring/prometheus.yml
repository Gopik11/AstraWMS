# Prometheus for AstraWMS (ADR-0018). Scrapes every service's /actuator/prometheus on the private Docker network;
# the gateway never routes /actuator, so the metrics are not reachable from outside.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: astrawms
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - master-data-service:8080
          - inventory-service:8080
          - inbound-service:8080
          - task-service:8080
          - outbound-service:8080
          - sap-adapter:8080
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
